spring.application.name=consumidores-service
server.port=${SERVER_PORT:8084}

# RDS PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?currentSchema=mensajeria
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=mensajeria
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seguridad Cognito 
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}

# ===== Consumidores SQS =====
# false = el servicio levanta (API, BD) pero no lee colas. 
app.consumidores.enabled=${CONSUMIDORES_ENABLED:false}
app.consumidores.aws-region=${AWS_REGION:us-east-1}
app.consumidores.instancia=${INSTANCIA_ID:consumidores-${server.port}}
app.consumidores.activos=${CONSUMIDORES_ACTIVOS:notificaciones,documentos,auditoria}
app.consumidores.max-mensajes=${SQS_MAX_MENSAJES:5}
app.consumidores.espera-segundos=${SQS_ESPERA_SEGUNDOS:20}
app.consumidores.backoff-base-segundos=${SQS_BACKOFF_BASE_SEGUNDOS:10}
app.consumidores.max-intentos=${SQS_MAX_INTENTOS:3}

app.consumidores.colas.notificaciones.url=${SQS_NOTIFICACIONES_URL:}
app.consumidores.colas.notificaciones.dlq-url=${SQS_NOTIFICACIONES_DLQ_URL:}
app.consumidores.colas.documentos.url=${SQS_DOCUMENTOS_URL:}
app.consumidores.colas.documentos.dlq-url=${SQS_DOCUMENTOS_DLQ_URL:}
app.consumidores.colas.auditoria.url=${SQS_AUDITORIA_URL:}
app.consumidores.colas.auditoria.dlq-url=${SQS_AUDITORIA_DLQ_URL:}
