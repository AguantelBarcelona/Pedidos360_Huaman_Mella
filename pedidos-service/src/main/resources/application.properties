spring.application.name=pedidos-service
server.port=8081

# Base de Datos RDS PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?currentSchema=pedidos
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=pedidos
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Seguridad Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}

# Comunicacion con microservicvios
inventario.service.url=http://localhost:8083
productos.service.url=http://localhost:8082

# Evaluacion 2 - SNS: mantener deshabilitado hasta configurar permisos AWS.
# El evento se registra en PostgreSQL (outbox) y se publica en segundo plano.
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.aws-region=${AWS_REGION:us-east-1}
app.messaging.sns-topic-arn=${SNS_TOPIC_ARN:}
app.messaging.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:10000}
