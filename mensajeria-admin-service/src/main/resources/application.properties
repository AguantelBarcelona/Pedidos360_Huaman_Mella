spring.application.name=mensajeria-admin-service
server.port=${SERVER_PORT:8086}

# Seguridad Cognito (mismas variables que pedidos-service). Todo /api/** exige grupo ADMIN.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}

app.admin.aws-region=${AWS_REGION:us-east-1}
# Solo se administran recursos cuyo nombre empiece con este prefijo (principio de menor alcance)
app.admin.prefijo=${MENSAJERIA_PREFIJO:pedidos360}
# Purga de DLQ: operacion destructiva, se puede deshabilitar en produccion
app.admin.permitir-purga=${PERMITIR_PURGA_DLQ:true}
# Instancias de consumidores-service a las que se reenvia pausar/reanudar (separadas por coma)
app.admin.consumidores-urls=${CONSUMIDORES_URLS:http://localhost:8084}

# Administracion Kinesis EV3
app.admin.kinesis.max-shards=${KINESIS_ADMIN_MAX_SHARDS:6}
app.admin.kinesis.max-retention-hours=${KINESIS_ADMIN_MAX_RETENTION_HOURS:168}
app.admin.kinesis.protected-streams=${KINESIS_PROTECTED_STREAMS:pedidos360-pedidos-stream,pedidos360-inventario-stream,pedidos360-eventos-fallidos}

# Aplicaciones consumidoras KCL administradas
app.admin.kinesis.analitica-app=${KINESIS_ANALITICA_APP:p360-pedidos-analitica}
app.admin.kinesis.trazabilidad-app=${KINESIS_TRAZABILIDAD_APP:p360-pedidos-trazabilidad}
app.admin.kinesis.inventario-app=${KINESIS_INVENTARIO_APP:p360-inventario-proyeccion}

# Streams asociados a las aplicaciones
app.admin.kinesis.pedidos-stream=${KINESIS_PEDIDOS_STREAM:pedidos360-pedidos-stream}
app.admin.kinesis.inventario-stream=${KINESIS_INVENTARIO_STREAM:pedidos360-inventario-stream}