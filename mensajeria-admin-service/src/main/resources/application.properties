spring.application.name=mensajeria-admin-service
server.port=${SERVER_PORT:8086}

# Seguridad Cognito (mismas variables que pedidos-service). Todo /api/** exige grupo ADMIN.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}

app.admin.aws-region=${AWS_REGION:us-east-1}
# Solo se administran recursos cuyo nombre empiece con este prefijo (principio de menor alcance)
app.admin.prefijo=${MENSAJERIA_PREFIJO:pedidos360}
# Purga de DLQ: operacion destructiva, se puede deshabilitar en produccion
app.admin.permitir-purga=${PERMITIR_PURGA_DLQ:true}
# Instancias de consumidores-service a las que se reenvia pausar/reanudar (separadas por coma)
app.admin.consumidores-urls=${CONSUMIDORES_URLS:http://localhost:8084}
