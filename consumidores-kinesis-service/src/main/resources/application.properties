spring.application.name=consumidores-kinesis-service
spring.main.web-application-type=none

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?currentSchema=mensajeria
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4

# EV3 - Kinesis
app.kinesis.enabled=${KINESIS_CONSUMERS_ENABLED:false}
app.kinesis.aws-region=${AWS_REGION:us-east-1}
app.kinesis.pedidos-stream=${KINESIS_PEDIDOS_STREAM:pedidos360-pedidos-stream}
app.kinesis.inventario-stream=${KINESIS_INVENTARIO_STREAM:pedidos360-inventario-stream}
app.kinesis.fallidos-stream=${KINESIS_FALLIDOS_STREAM:pedidos360-eventos-fallidos}

# Aplicaciones consumidoras independientes
app.kinesis.analitica-app=p360-pedidos-analitica
app.kinesis.trazabilidad-app=p360-pedidos-trazabilidad
app.kinesis.inventario-app=p360-inventario-proyeccion

# Control de procesamiento
app.kinesis.initial-position=${KINESIS_INITIAL_POSITION:TRIM_HORIZON}
app.kinesis.poll-ms=${KINESIS_POLL_MS:1000}
app.kinesis.max-attempts=${KINESIS_MAX_ATTEMPTS:3}
app.kinesis.retry-delay-ms=${KINESIS_RETRY_DELAY_MS:500}
app.kinesis.timeout-ms=${KINESIS_TIMEOUT_MS:10000}
spring.sql.init.mode=always

# Configuracion de workers KCL
app.kinesis.worker-id=${KINESIS_WORKER_ID:worker}
app.kinesis.max-records=${KINESIS_MAX_RECORDS:25}
app.kinesis.metrics-level=${KINESIS_METRICS_LEVEL:SUMMARY}
