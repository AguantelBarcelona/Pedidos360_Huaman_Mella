
# Nombre y puerto del microservicio
spring.application.name=mensajeria-service
server.port=8084

# Estado de los consumidores SQS
mensajeria.enabled=false
mensajeria.poll-delay-ms=5000

# Configuracion AWS
aws.region=us-east-1

# Conexion a PostgreSQL RDS
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Monitoreo
management.endpoints.web.exposure.include=health,info

# Crear tablas necesarias al iniciar el servicio
spring.sql.init.mode=always

# Acceso local hasta implementar seguridad Cognito
server.address=127.0.0.1

# Autenticacion con el Cognito existente de Pedidos360
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}
